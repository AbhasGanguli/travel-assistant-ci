name: Build private debug APK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional full source commit SHA; blank uses requested-source.txt"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "ops/BUILD_VALIDATED_APK"

permissions:
  contents: read

concurrency:
  group: private-debug-apk
  cancel-in-progress: false

jobs:
  build:
    name: Test and stage APK privately
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source_ref.outputs.sha }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_url: ${{ steps.publish.outputs.release_url }}
      version_code: ${{ steps.apk.outputs.version_code }}
      signing_cert_sha256: ${{ steps.apk.outputs.signing_cert_sha256 }}
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
      firebase_app_id: ${{ steps.firebase_config.outputs.app_id }}

    steps:
      - name: Check out CI controller
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Validate source SHA
        id: source_ref
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTED_SHA" ]]; then
            REQUESTED_SHA="$(tr -d '[:space:]' < control/requested-source.txt)"
          fi
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Selected source SHA: $REQUESTED_SHA"

      - name: Check required credentials without printing them
        shell: bash
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
          NONPROD_GOOGLE_SERVICES_JSON: ${{ secrets.NONPROD_GOOGLE_SERVICES_JSON }}
          TRAVEL_AGENT_DEBUG_TOKEN: ${{ secrets.TRAVEL_AGENT_DEBUG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_RELEASE_TOKEN" ]]; then
            echo "::error::Add repository secret PRIVATE_REPO_RELEASE_TOKEN with Contents: Read and write access to AbhasGanguli/travel-assistant."
            exit 1
          fi
          if [[ -z "$NONPROD_GOOGLE_SERVICES_JSON" ]]; then
            echo "::error::Add repository secret NONPROD_GOOGLE_SERVICES_JSON containing the google-services.json for Firebase project travel-agent-9c305."
            exit 1
          fi
          if [[ -z "$TRAVEL_AGENT_DEBUG_TOKEN" ]]; then
            echo "::error::Add repository secret TRAVEL_AGENT_DEBUG_TOKEN using the fixed App Check debug token already registered for Firebase project travel-agent-9c305."
            exit 1
          fi
          echo "Required build credentials are configured; token values are not printed."

      - name: Check out private application source
        uses: actions/checkout@v4
        with:
          repository: AbhasGanguli/travel-assistant
          ref: ${{ steps.source_ref.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked-out source
        working-directory: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source_ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out source SHA did not match the requested SHA."
            exit 1
          fi
          echo "Source checkout verified: $actual_sha"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            source/**/*.gradle
            source/**/*.gradle.kts
            source/gradle/libs.versions.toml
            source/gradle/wrapper/gradle-wrapper.properties

      - name: Restore stable private CI signing key
        id: signing
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download ci-debug-signing-key-v1 \
            --repo AbhasGanguli/travel-assistant \
            --pattern ci-debug.keystore \
            --dir .
          test -s ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass android -alias androiddebugkey >/dev/null
          keytool -exportcert -keystore ci-debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/ci-debug-cert.der" >/dev/null
          fingerprint="$(sha256sum "$RUNNER_TEMP/ci-debug-cert.der" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Stable keystore restored from private release; certificate SHA-256: $fingerprint"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > "$RUNNER_TEMP/sdkmanager.log" 2>&1
          echo "Android SDK components installed."

      - name: Configure non-production Firebase resources
        id: firebase_config
        working-directory: source
        shell: bash
        env:
          NONPROD_GOOGLE_SERVICES_JSON: ${{ secrets.NONPROD_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$NONPROD_GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          if project_id != "travel-agent-9c305":
              raise SystemExit("Configured Firebase project must be travel-agent-9c305.")

          app_id = None
          for client in config.get("client", []):
              info = client.get("client_info", {})
              android = info.get("android_client_info", {})
              if android.get("package_name") == "com.travelassistant.app":
                  app_id = info.get("mobilesdk_app_id")
                  break

          if not app_id:
              raise SystemExit("Firebase config does not include com.travelassistant.app with a mobile app ID.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"app_id={app_id}\n")
          print("Non-production Firebase config validated.")
          PY

      - name: Run JVM regression suite before packaging
        working-directory: source
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --console=plain > "$RUNNER_TEMP/apk-unit-tests.log" 2>&1
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "JVM regression suite: PASS"
          else
            echo "::error::JVM regression suite failed; APK will not be published."
            echo "Sanitized Kotlin/Gradle diagnostics:"
            diagnostics="$(grep -E '^e: |^> Task .* FAILED|^FAILURE: Build failed|^Execution failed for task|^Caused by:' "$RUNNER_TEMP/apk-unit-tests.log" | sed -E 's#file:///[^:]+/source/#file://<source>/#g; s#/home/runner/work/[^/:]+/[^/:]+/source/#<source>/#g' | cut -c1-260 | head -n 50 || true)"
            if [[ -z "$diagnostics" ]]; then
              diagnostics="$(tail -n 80 "$RUNNER_TEMP/apk-unit-tests.log" | sed -E 's#file:///[^:]+/source/#file://<source>/#g; s#/home/runner/work/[^/:]+/[^/:]+/source/#<source>/#g' | cut -c1-260 | head -n 80 || true)"
            fi
            if [[ -n "$diagnostics" ]]; then
              printf '%s\n' "$diagnostics"
              {
                echo "### Sanitized Kotlin/Gradle diagnostics"
                echo '```text'
                printf '%s\n' "$diagnostics"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path("app/build/test-results/testDebugUnitTest")
          failures = []
          for report in sorted(root.glob("TEST-*.xml")) if root.exists() else []:
              try:
                  suite = ET.parse(report).getroot()
              except Exception:
                  continue
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      item = case.find(kind)
                      if item is None:
                          continue
                      message = item.attrib.get("message", "")
                      detail = (item.text or "").strip()
                      detail = re.sub(r"/home/runner/work/[^\s:]+/source/", "<source>/", detail)
                      detail = re.sub(r"file:///[^\s:]+/source/", "file://<source>/", detail)
                      block = f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}: {message}\n{detail[:1800]}"
                      failures.append(block)
                      break
          if failures:
              print("Sanitized JVM test failures:")
              for block in failures[:12]:
                  print(block)
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n### Sanitized JVM test failures\n```text\n")
                  summary.write("\n---\n".join(failures[:12]))
                  summary.write("\n```\n")
          else:
              print("No JUnit XML failure details were available in the test-results directory.")
          PY
            exit "$code"
          fi

      - name: Assemble debug APK (suppress private build logs)
        id: assemble
        working-directory: source
        shell: bash
        env:
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.TRAVEL_AGENT_DEBUG_TOKEN }}
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug -PappVersionCode="$GITHUB_RUN_NUMBER" --console=plain > "$RUNNER_TEMP/apk-build.log" 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -eq 0 ]]; then
            echo "Debug APK build: PASS"
          else
            echo "::error::Debug APK build failed. Raw Gradle output is suppressed because the application source is private."
            grep -E '^FAILURE: Build failed|^Execution failed for task|^Could not resolve ' "$RUNNER_TEMP/apk-build.log"               | sed -E 's#file://[^ ]+#<source-path>#g; s#https?://[^ ]+#<url>#g'               | cut -c1-180 | head -n 8 || true
            exit "$code"
          fi

      - name: Verify APK signing certificate and calculate checksum
        id: apk
        if: steps.assemble.outputs.exit_code == '0'
        working-directory: source
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          actual_version_code="$("$apkanalyzer" manifest version-code "$apk")"
          expected_version_code="$GITHUB_RUN_NUMBER"
          if [[ "$actual_version_code" != "$expected_version_code" ]]; then
            echo "::error::APK versionCode ($actual_version_code) does not match CI run number ($expected_version_code). Refusing to publish."
            exit 1
          fi
          echo "version_code=$actual_version_code" >> "$GITHUB_OUTPUT"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signing-cert.txt"
          actual_fingerprint="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signing-cert.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_fingerprint" || -z "$expected_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::APK signer certificate does not match the persisted stable CI key. Refusing to publish."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "signing_cert_sha256=$actual_fingerprint" >> "$GITHUB_OUTPUT"
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          printf '%s  %s\n' "$apk_sha256" "$apk" | tee "$RUNNER_TEMP/apk-checksum.txt"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "APK certificate SHA-256 verified against persisted private CI signing key."
          {
            echo "### APK signing identity"
            echo "- Certificate SHA-256: `$actual_fingerprint`"
            echo "- Verified against private release `ci-debug-signing-key-v1`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage APK in a temporary private source-repo release
        id: publish
        if: steps.assemble.outputs.exit_code == '0'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.source_ref.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SIGNING_CERT_SHA256: ${{ steps.apk.outputs.signing_cert_sha256 }}
        run: |
          set -euo pipefail
          tag="ci-apk-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo AbhasGanguli/travel-assistant \
            --target "$SOURCE_SHA" \
            --title "Temporary APK staging - ${SOURCE_SHA:0:12}" \
            --notes "Private staging asset for Firebase App Distribution. Source commit: $SOURCE_SHA. Version code: ${{ steps.apk.outputs.version_code }}. Signing certificate SHA-256: $SIGNING_CERT_SHA256. Automatically deleted after successful Firebase delivery; retained as a private fallback if delivery is unavailable or fails. Do not delete the stable signing-key release."
          release_url="https://github.com/AbhasGanguli/travel-assistant/releases/tag/$tag"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "Private staging release created: $release_url"
          echo "The APK was not uploaded as an artifact to the public CI repository."

  distribute:
    name: Distribute APK to Firebase
    needs: build
    if: ${{ needs.build.result == 'success' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      firebase_outcome: ${{ steps.firebase_distribute.outcome }}
      cleanup_outcome: ${{ steps.cleanup_private_release.outcome }}

    steps:
      - name: Download the exact APK from the private staging release
        id: download_apk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          EXPECTED_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_APK_SHA256"
          mkdir -p "$RUNNER_TEMP/travel-assistant-apk"
          gh release download "$RELEASE_TAG" \
            --repo AbhasGanguli/travel-assistant \
            --pattern "app-debug.apk" \
            --dir "$RUNNER_TEMP/travel-assistant-apk"
          apk="$RUNNER_TEMP/travel-assistant-apk/app-debug.apk"
          test -s "$apk"
          actual_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_APK_SHA256" ]]; then
            echo "::error::Downloaded APK checksum does not match the build job output."
            exit 1
          fi
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "Private staging APK checksum verified."

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools

      - name: Distribute signed APK through Firebase App Distribution
        id: firebase_distribute
        shell: bash
        env:
          APK_PATH: ${{ steps.download_apk.outputs.apk_path }}
          FIREBASE_APP_ID: ${{ needs.build.outputs.firebase_app_id }}
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
          EXPECTED_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          test -n "$FIREBASE_APP_ID"
          tester_group="${FIREBASE_TESTER_GROUP:-internal-testers}"
          printf 'Travel Assistant internal build %s\nSource commit: %s\n' \
            "$EXPECTED_VERSION_CODE" "$SOURCE_SHA" > "$RUNNER_TEMP/release-notes.txt"
          # Firebase CLI success output contains a temporary APK download URL with a bearer token.
          # This repository is public, so never print the raw CLI output into Actions logs.
          firebase_log="$RUNNER_TEMP/firebase-appdistribution.log"
          set +e
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$tester_group" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt" \
            >"$firebase_log" 2>&1
          firebase_exit_code=$?
          set -e
          if [[ "$firebase_exit_code" -ne 0 ]]; then
            echo "::error::Firebase App Distribution failed (exit code $firebase_exit_code). Raw CLI output was suppressed because it may contain temporary APK download credentials."
            exit "$firebase_exit_code"
          fi
          echo "Firebase App Distribution upload and tester-group distribution succeeded."

      - name: Remove private staging release after successful Firebase delivery
        id: cleanup_private_release
        if: steps.firebase_distribute.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" \
            --repo AbhasGanguli/travel-assistant \
            --cleanup-tag \
            --yes
          echo "Temporary private APK staging release and tag removed."

  status:
    name: Record non-secret build status
    needs: [build, distribute]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out CI controller for status update
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: true

      - name: Publish non-secret APK build status to CI controller
        working-directory: control
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_URL: ${{ needs.build.outputs.release_url }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SIGNING_CERT_SHA256: ${{ needs.build.outputs.signing_cert_sha256 }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          FIREBASE_CONFIGURED: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
          FIREBASE_JOB_RESULT: ${{ needs.distribute.result }}
          FIREBASE_OUTCOME: ${{ needs.distribute.outputs.firebase_outcome }}
          CLEANUP_OUTCOME: ${{ needs.distribute.outputs.cleanup_outcome }}
        run: |
          set -euo pipefail

          result="FAILED"
          firebase_status="SKIPPED_NOT_CONFIGURED"
          private_release_status="NONE"
          private_release_url="NONE"
          if [[ -n "${RELEASE_URL:-}" ]]; then
            private_release_status="RETAINED_PRIVATE_STAGING_RELEASE"
            private_release_url="$RELEASE_URL"
          fi

          if [[ "$BUILD_RESULT" == "success" ]]; then
            if [[ "$FIREBASE_CONFIGURED" == "true" ]]; then
              if [[ "$FIREBASE_JOB_RESULT" == "success" && "$FIREBASE_OUTCOME" == "success" ]]; then
                result="READY"
                firebase_status="SUCCESS"
                if [[ "$CLEANUP_OUTCOME" == "success" ]]; then
                  private_release_status="REMOVED_AFTER_SUCCESSFUL_FIREBASE_DISTRIBUTION"
                  private_release_url="NONE"
                elif [[ "$CLEANUP_OUTCOME" == "failure" ]]; then
                  private_release_status="RETAINED_CLEANUP_FAILED"
                  private_release_url="$RELEASE_URL"
                fi
              else
                result="FAILED"
                firebase_status="FAILED"
                private_release_status="RETAINED_AFTER_FIREBASE_FAILURE"
                private_release_url="$RELEASE_URL"
              fi
            else
              result="READY_PRIVATE_FALLBACK"
              private_release_status="RETAINED_WIF_NOT_CONFIGURED"
              private_release_url="$RELEASE_URL"
            fi
          else
            firebase_status="NOT_RUN_BUILD_FAILED"
          fi

          {
            echo "status=$result"
            echo "source_sha=${SOURCE_SHA:-NOT_RESOLVED}"
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "signing_certificate_sha256=${SIGNING_CERT_SHA256:-NOT_VERIFIED}"
            echo "apk_sha256=${APK_SHA256:-NOT_AVAILABLE}"
            echo "version_code=${VERSION_CODE:-NOT_VERIFIED}"
            echo "firebase_app_distribution_status=$firebase_status"
            echo "private_release_status=$private_release_status"
            echo "private_release_url=$private_release_url"
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUNNER_TEMP/latest-apk-build-status.txt"

          # Only this trusted status job gets a write-capable GITHUB_TOKEN.
          # The application source is never checked out or executed in this job.
          git fetch origin main
          git checkout -B status-update origin/main
          cp "$RUNNER_TEMP/latest-apk-build-status.txt" ops/latest-apk-build-status.txt
          git add ops/latest-apk-build-status.txt
          if git diff --cached --quiet; then
            echo "APK build status is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record latest private APK build status"
          git push origin HEAD:main
          echo "Published non-secret build status to the controller repository."
