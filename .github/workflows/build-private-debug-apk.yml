name: Build private debug APK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional full source commit SHA; blank uses requested-source.txt"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "ops/BUILD_VALIDATED_APK"

permissions:
  contents: write

concurrency:
  group: private-debug-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish APK to private source repo
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out CI controller
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: true

      - name: Validate source SHA
        id: source_ref
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTED_SHA" ]]; then
            REQUESTED_SHA="$(tr -d '[:space:]' < control/requested-source.txt)"
          fi
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Selected source SHA: $REQUESTED_SHA"

      - name: Check required credentials without printing them
        shell: bash
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
          NONPROD_GOOGLE_SERVICES_JSON: ${{ secrets.NONPROD_GOOGLE_SERVICES_JSON }}
          TRAVEL_AGENT_DEBUG_TOKEN: ${{ secrets.TRAVEL_AGENT_DEBUG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_RELEASE_TOKEN" ]]; then
            echo "::error::Add repository secret PRIVATE_REPO_RELEASE_TOKEN with Contents: Read and write access to AbhasGanguli/travel-assistant."
            exit 1
          fi
          if [[ -z "$NONPROD_GOOGLE_SERVICES_JSON" ]]; then
            echo "::error::Add repository secret NONPROD_GOOGLE_SERVICES_JSON containing the google-services.json for Firebase project travel-agent-9c305."
            exit 1
          fi
          if [[ -z "$TRAVEL_AGENT_DEBUG_TOKEN" ]]; then
            echo "::error::Add repository secret TRAVEL_AGENT_DEBUG_TOKEN using the fixed App Check debug token already registered for Firebase project travel-agent-9c305."
            exit 1
          fi
          echo "Required build credentials are configured; token values are not printed."

      - name: Check out private application source
        uses: actions/checkout@v4
        with:
          repository: AbhasGanguli/travel-assistant
          ref: ${{ steps.source_ref.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked-out source
        working-directory: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source_ref.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out source SHA did not match the requested SHA."
            exit 1
          fi
          echo "Source checkout verified: $actual_sha"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            source/**/*.gradle
            source/**/*.gradle.kts
            source/gradle/libs.versions.toml
            source/gradle/wrapper/gradle-wrapper.properties

      - name: Restore stable private CI signing key
        id: signing
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download ci-debug-signing-key-v1 \
            --repo AbhasGanguli/travel-assistant \
            --pattern ci-debug.keystore \
            --dir .
          test -s ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass android -alias androiddebugkey >/dev/null
          keytool -exportcert -keystore ci-debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/ci-debug-cert.der" >/dev/null
          fingerprint="$(sha256sum "$RUNNER_TEMP/ci-debug-cert.der" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Stable keystore restored from private release; certificate SHA-256: $fingerprint"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > "$RUNNER_TEMP/sdkmanager.log" 2>&1
          echo "Android SDK components installed."

      - name: Configure non-production Firebase resources
        working-directory: source
        shell: bash
        env:
          NONPROD_GOOGLE_SERVICES_JSON: ${{ secrets.NONPROD_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$NONPROD_GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if project_id != "travel-agent-9c305":
              raise SystemExit("Configured Firebase project must be travel-agent-9c305.")
          if "com.travelassistant.app" not in package_names:
              raise SystemExit("Firebase config does not include com.travelassistant.app.")
          print("Non-production Firebase config validated.")
          PY

      - name: Run JVM regression suite before packaging
        working-directory: source
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --console=plain > "$RUNNER_TEMP/apk-unit-tests.log" 2>&1
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "JVM regression suite: PASS"
          else
            echo "::error::JVM regression suite failed; APK will not be published."
            echo "Sanitized Kotlin/Gradle diagnostics:"
            diagnostics="$(grep -E '^e: |^w: |^> Task .* FAILED|^FAILURE: Build failed' "$RUNNER_TEMP/apk-unit-tests.log" | sed -E 's#file:///[^:]+/source/#file://<source>/#g; s#/home/runner/work/[^/:]+/[^/:]+/source/#<source>/#g' | cut -c1-260 | head -n 30 || true)"
            if [[ -n "$diagnostics" ]]; then
              printf '%s\n' "$diagnostics"
              {
                echo "### Sanitized Kotlin/Gradle diagnostics"
                echo '```text'
                printf '%s\n' "$diagnostics"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            python3 - <<'PY'
from pathlib import Path
import re
import xml.etree.ElementTree as ET
root = Path("app/build/test-results/testDebugUnitTest")
failures = []
for report in sorted(root.glob("TEST-*.xml")) if root.exists() else []:
    try:
        suite = ET.parse(report).getroot()
    except Exception:
        continue
    for case in suite.iter("testcase"):
        for kind in ("failure", "error"):
            item = case.find(kind)
            if item is None:
                continue
            message = item.attrib.get("message", "")
            detail = (item.text or "").strip()
            detail = re.sub(r"/home/runner/work/[^\s:]+/source/", "<source>/", detail)
            detail = re.sub(r"file:///[^\s:]+/source/", "file://<source>/", detail)
            block = f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}: {message}\n{detail[:1800]}"
            failures.append(block)
            break
if failures:
    print("Sanitized JVM test failures:")
    for block in failures[:12]:
        print(block)
    with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
        summary.write("\n### Sanitized JVM test failures\n```text\n")
        summary.write("\n---\n".join(failures[:12]))
        summary.write("\n```\n")
else:
    print("No JUnit XML failure details were available in the test-results directory.")
PY
            exit "$code"
          fi

      - name: Assemble debug APK (suppress private build logs)
        id: assemble
        working-directory: source
        shell: bash
        env:
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.TRAVEL_AGENT_DEBUG_TOKEN }}
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain > "$RUNNER_TEMP/apk-build.log" 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -eq 0 ]]; then
            echo "Debug APK build: PASS"
          else
            echo "::error::Debug APK build failed. Raw Gradle output is suppressed because the application source is private."
            grep -E '^FAILURE: Build failed|^Execution failed for task|^Could not resolve ' "$RUNNER_TEMP/apk-build.log"               | sed -E 's#file://[^ ]+#<source-path>#g; s#https?://[^ ]+#<url>#g'               | cut -c1-180 | head -n 8 || true
            exit "$code"
          fi

      - name: Verify APK signing certificate and calculate checksum
        id: apk
        if: steps.assemble.outputs.exit_code == '0'
        working-directory: source
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signing-cert.txt"
          actual_fingerprint="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signing-cert.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_fingerprint" || -z "$expected_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::APK signer certificate does not match the persisted stable CI key. Refusing to publish."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "signing_cert_sha256=$actual_fingerprint" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk-checksum.txt"
          echo "APK certificate SHA-256 verified against persisted private CI signing key."
          {
            echo "### APK signing identity"
            echo "- Certificate SHA-256: `$actual_fingerprint`"
            echo "- Verified against private release `ci-debug-signing-key-v1`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK only to a private GitHub release
        id: publish
        if: steps.assemble.outputs.exit_code == '0'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.source_ref.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SIGNING_CERT_SHA256: ${{ steps.apk.outputs.signing_cert_sha256 }}
        run: |
          set -euo pipefail
          tag="ci-apk-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo AbhasGanguli/travel-assistant \
            --target "$SOURCE_SHA" \
            --title "Temporary debug APK - ${SOURCE_SHA:0:12}" \
            --notes "Temporary debug APK for manual validation. Source commit: $SOURCE_SHA. Signing certificate SHA-256: $SIGNING_CERT_SHA256. Built and verified with persistent private signing key ci-debug-signing-key-v1. Delete this APK release and its tag after downloading; do not delete the stable signing-key release."
          release_url="https://github.com/AbhasGanguli/travel-assistant/releases/tag/$tag"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "Private release created: $release_url"
          echo "The APK was not uploaded as an artifact to the public CI repository."

      - name: Publish non-secret APK build status to CI controller
        if: always()
        working-directory: control
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source_ref.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ASSEMBLE_EXIT_CODE: ${{ steps.assemble.outputs.exit_code }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          SIGNING_CERT_SHA256: ${{ steps.apk.outputs.signing_cert_sha256 }}
        run: |
          set -euo pipefail
          result="FAILED"
          if [[ "$ASSEMBLE_EXIT_CODE" == "0" && "$PUBLISH_OUTCOME" == "success" ]]; then
            result="READY"
          fi
          apk_sha256="NOT_AVAILABLE"
          if [[ -s "$RUNNER_TEMP/apk-checksum.txt" ]]; then
            apk_sha256="$(awk '{print $1}' "$RUNNER_TEMP/apk-checksum.txt")"
          fi
          cert_sha256="${SIGNING_CERT_SHA256:-NOT_VERIFIED}"
          release="${RELEASE_URL:-NONE}"
          source="${SOURCE_SHA:-NOT_RESOLVED}"
          {
            echo "status=$result"
            echo "source_sha=$source"
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "signing_certificate_sha256=$cert_sha256"
            echo "apk_sha256=$apk_sha256"
            echo "private_release_url=$release"
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUNNER_TEMP/latest-apk-build-status.txt"

          # Publish status metadata only; APK binaries and signing material stay private.
          git fetch origin main
          git checkout -B status-update origin/main
          cp "$RUNNER_TEMP/latest-apk-build-status.txt" ops/latest-apk-build-status.txt
          git add ops/latest-apk-build-status.txt
          if git diff --cached --quiet; then
            echo "APK build status is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record latest private APK build status"
          git push origin HEAD:main
          echo "Published non-secret build status to the controller repository."
