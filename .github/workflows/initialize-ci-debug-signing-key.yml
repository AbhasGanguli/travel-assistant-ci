name: Initialize stable private debug signing key

on:
  workflow_dispatch:
    inputs:
      confirm_create:
        description: "Type CREATE to generate the one-time key and store it only in the private app repository release"
        required: true
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "ops/CREATE_STABLE_SIGNING_KEY"

permissions:
  contents: write

concurrency:
  group: initialize-stable-ci-debug-key
  cancel-in-progress: false

jobs:
  initialize:
    name: Create one persistent signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out CI controller
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Require explicit one-time confirmation
        env:
          CONFIRM_CREATE: ${{ inputs.confirm_create }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$CONFIRM_CREATE" != "CREATE" ]]; then
              echo "::error::Set confirm_create to CREATE to proceed."
              exit 1
            fi
          else
            if [[ ! -f ops/CREATE_STABLE_SIGNING_KEY ]] || [[ "$(tr -d '[:space:]' < ops/CREATE_STABLE_SIGNING_KEY)" != "CREATE" ]]; then
              echo "::error::The one-time key initialization signal is missing or invalid."
              exit 1
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check private release credentials and detect the persistent key
        id: release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PRIVATE_REPO_RELEASE_TOKEN is required."
            exit 1
          fi
          if gh release view ci-debug-signing-key-v1 --repo AbhasGanguli/travel-assistant >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Stable key release exists; this run will validate it rather than replace it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Stable key release is absent; this run may create it once."
          fi

      - name: Restore existing private key assets
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download ci-debug-signing-key-v1 --repo AbhasGanguli/travel-assistant --dir .
          echo "Downloaded existing assets from the private key release."

      - name: Generate the stable debug keystore once
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore ci-debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Travel Assistant CI Debug, OU=Development, O=Travel Assistant, L=Kolkata, ST=West Bengal, C=IN" \
            >/dev/null 2>&1
          keytool -list -keystore ci-debug.keystore -storepass android -alias androiddebugkey >/dev/null
          keytool -exportcert -keystore ci-debug.keystore -storepass android -alias androiddebugkey -file ci-debug-cert.der >/dev/null
          fingerprint="$(sha256sum ci-debug-cert.der | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          printf '%s  %s\n' "$fingerprint" "ci-debug-cert.der" > ci-debug-cert.sha256
          echo "Created one new CI debug signing identity."
          echo "Certificate SHA-256: $fingerprint"

      - name: Store new key only in a private app-repository release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create ci-debug-signing-key-v1 \
            ci-debug.keystore ci-debug-cert.der ci-debug-cert.sha256 \
            --repo AbhasGanguli/travel-assistant \
            --target main \
            --title "Stable CI debug signing key v1" \
            --notes "Persistent CI debug signing identity for AbhasGanguli/travel-assistant. Private release asset; never delete, replace, or regenerate this key. CI APK builds must download this exact keystore and verify the APK signer SHA-256 before publishing. Alias androiddebugkey; store/key password android."
          echo "New stable signing key stored in the private app repository release."

      - name: Validate persistent signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          test -s ci-debug.keystore
          test -s ci-debug-cert.der
          test -s ci-debug-cert.sha256
          keytool -list -keystore ci-debug.keystore -storepass android -alias androiddebugkey >/dev/null
          keytool -exportcert -keystore ci-debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/ci-debug-cert-verify.der" >/dev/null
          if ! cmp -s ci-debug-cert.der "$RUNNER_TEMP/ci-debug-cert-verify.der"; then
            echo "::error::Stored public certificate does not match the persistent keystore."
            exit 1
          fi
          sha256sum --check ci-debug-cert.sha256 >/dev/null
          fingerprint="$(sha256sum ci-debug-cert.der | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Persistent signing key verified; certificate SHA-256: $fingerprint"

      - name: Publish non-secret verification status to CI controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CERTIFICATE_SHA256: ${{ steps.signing.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/stable-signing-key-status.txt"
          {
            echo "status=READY"
            echo "private_release=ci-debug-signing-key-v1"
            echo "certificate_sha256=$CERTIFICATE_SHA256"
            echo "key_material_location=private app-repository release only"
            echo "verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$status_file"

          # Commit only public certificate metadata, never the private keystore.
          git fetch origin main
          git checkout -B status-update origin/main
          cp "$status_file" ops/stable-signing-key-status.txt
          git add ops/stable-signing-key-status.txt
          if git diff --cached --quiet; then
            echo "Verification status is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record verified stable CI signing certificate"
          git push origin HEAD:main
          echo "Published fingerprint-only verification status; no private key bytes were committed."